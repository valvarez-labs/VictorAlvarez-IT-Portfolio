<!DOCTYPE html> <!-- Document de tipus HTML5 -->
<html xmlns="http://www.w3.org/1999/xhtml"> 
    <head>   
        <link rel="stylesheet" type="text/css" href="estils/estilicus.css" />
        <title>Estils</title> 
        <meta charset="UTF-8">
        <style>
            header h1 {background-color: rgb(175, 173, 173);}
            header h2 {background-color: rgb(212, 211, 209);}
            main h1 {background-color: rgb(175, 173, 173); border-bottom: 4px solid blue;}
            section h1 {background-color: rgb(192, 189, 189);}
            article h1 {background-color: orange; text-align: center;}
            article + article h1 {background-color: rgb(226, 223, 18); text-align: center;}
            article {background-color: orange; display: inline-block; width: 700px;}
            article + article {background-color: rgb(226, 223, 18); display: inline-block; width: 300px;}
            * {margin: auto; padding: 0%;}
        </style>
    </head> 
    <body>
        <header>
            <h1>T&iacute;tol del document</h1><br>
            <h2>Una plana d'exemple</h2><br>
        </header>
        <main>
            <h1>Part principal</h1><br>
            <section>
                <h1>Una secció amb 2 articles</h1><br>
                <article>
                    <h1>Primer article</h1>
                    <p>Text del primer article</p>
                </article>
                <article>
                    <h1>Segon article</h1>
                    <p>Text del segon article</p>
                </article>
            </section>
        </main>
        <footer>
            <h3>Alg&uacute; ha escrit aix&ograve; (footer)</h3>
        </footer>
    </body>
</html>
