<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejemplo de lista ordenada</title>
    <style>
        li.custom-style{
            color: red;
            font-weight: bold;
            font-style: italic;
            font-size: 12px;
            font-family: "Arial", sans-serif;     
        }
    </style>
</head>
<body>
    
    <p>Lista de 5 animales ordenados de mayor a menor tamaño:</p>
    <ol>
        <li class="custom-style">Elefante</li>
        <li class="custom-style">Cebra</li>
        <li class="custom-style">Oveja</li>
        <li class="custom-style">Gato</li>
        <li class="custom-style">Ratón</li>
    </ol>
</body>
</html>
